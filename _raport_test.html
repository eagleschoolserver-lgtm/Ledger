function safeText_(v){ return String(v == null ? "" : v); }
function metaFieldHtml_(label, value){
  return `<span class="meta-line"><span class="meta-label">${safeText_(label)}</span><span class="meta-colon">:</span><span class="meta-value">${safeText_(value || "")}</span></span>`;
}
function fillMetaTables_(doc, ctx){
  const metaTables = Array.from(doc.querySelectorAll("table.meta"));
  metaTables.forEach(tbl=>{
    const rows = tbl.querySelectorAll("tr");
    if(rows[0]){
      const tds = rows[0].querySelectorAll("td");
      if(tds[0]) tds[0].innerHTML = metaFieldHtml_("Nama Sekolah", ctx.schoolName);
      if(tds[1]) tds[1].innerHTML = metaFieldHtml_("Fase / Tingkatan", ctx.faseText);
    }
    if(rows[1]){
      const tds = rows[1].querySelectorAll("td");
      if(tds[0]) tds[0].innerHTML = metaFieldHtml_("Alamat", ctx.address);
      if(tds[1]) tds[1].innerHTML = metaFieldHtml_("Kelas", ctx.className);
    }
    if(rows[2]){
      const tds = rows[2].querySelectorAll("td");
      if(tds[0]) tds[0].innerHTML = metaFieldHtml_("Nama Siswa", ctx.studentName);
      if(tds[1]) tds[1].innerHTML = metaFieldHtml_("Semester", ctx.semesterLabel);
    }
    if(rows[3]){
      const tds = rows[3].querySelectorAll("td");
      if(tds[0]) tds[0].innerHTML = metaFieldHtml_("NIS / NISN", ctx.nisText);
      if(tds[1]) tds[1].innerHTML = metaFieldHtml_("Tahun Pelajaran", ctx.yearLabel);
    }
  });
}
function fillSubjectTableGenap_(table, rowsData){
  const rows = Array.from(table.querySelectorAll("tr")).filter(tr=>!tr.classList.contains("group-row"));
  const dataRows = rows.slice(1);
  dataRows.forEach((tr, idx)=>{
    const d = rowsData[idx] || {};
    const tds = tr.querySelectorAll("td");
    if(tds[1] && d.relabel && d.label) tds[1].textContent = d.label;
    if(tds[3]) tds[3].textContent = d.final || "";
    if(tds[4]) tds[4].textContent = safeText_(d.kompetensiText || "");
  });
}
function fillTalentTableGenap_(table, talent){
  const rows = table.querySelectorAll("tr");
  const groupRow = rows[1];
  const row1 = rows[2];
  const row2 = rows[3];
  const jenis = safeText_(talent.name || "");
  if(groupRow){
    const td = groupRow.querySelector("td");
    if(td) td.textContent = jenis ? `Jenis Talent - ${jenis}` : "Jenis Talent";
  }
  if(row1){
    const tds = row1.querySelectorAll("td");
    if(tds[1]) tds[1].textContent = jenis;
    if(tds[2]) tds[2].textContent = safeText_(talent.predicate || "");
    if(tds[3]) tds[3].textContent = safeText_(talent.description || "");
  }
  if(row2){
    const tds = row2.querySelectorAll("td");
    if(tds[1]) tds[1].textContent = "";
    if(tds[2]) tds[2].textContent = "";
    if(tds[3]) tds[3].textContent = "";
  }
}
function fillEkskulTable_(table, ekskul){
  const rows = Array.from(table.querySelectorAll("tr")).slice(1);
  const list = Array.isArray(ekskul) ? ekskul : [];
  rows.forEach((tr, idx)=>{
    const item = list[idx] || {};
    const tds = tr.querySelectorAll("td");
    if(tds[1]) tds[1].textContent = safeText_(item.name || "");
    if(tds[2]) tds[2].textContent = safeText_(item.predicate || "");
    if(tds[3]) tds[3].textContent = safeText_(item.description || "");
  });
}
function fillSingleColumnTable_(table, value){
  const rows = table.querySelectorAll("tr");
  if(rows[1]){
    const td = rows[1].querySelectorAll("td")[1];
    if(td) td.textContent = safeText_(value || "");
  }
}
function fillAbsensiTable_(table, meta){
  const rows = table.querySelectorAll("tr");
  const hari = v => { const n = Number(v || 0); return n > 0 ? `${n} hari` : "- hari"; };
  if(rows[1]){ const td = rows[1].querySelectorAll("td")[1]; if(td) td.textContent = hari(meta.sakit); }
  if(rows[2]){ const td = rows[2].querySelectorAll("td")[1]; if(td) td.textContent = hari(meta.izin); }
  if(rows[3]){ const td = rows[3].querySelectorAll("td")[1]; if(td) td.textContent = hari(meta.alpha); }
}

const RAPORT_PDF_MARGIN_ = [37.1, 8.9, 21.8, 11.7];
const RAPORT_PDF_SCALE_ = 2;
function raportPageGridPx_(pageSize){
  const m = RAPORT_PDF_MARGIN_;
  const innerW = (pageSize && pageSize.inner) ? pageSize.inner.width : (210 - m[1] - m[3]);
  const innerH = (pageSize && pageSize.inner) ? pageSize.inner.height : (297 - m[0] - m[2]);
  const k = (pageSize && pageSize.k) ? pageSize.k : (72 / 25.4);
  const wcss = innerW * k / 72 * 96;
  const wdev = Math.ceil(wcss) * RAPORT_PDF_SCALE_;
  return Math.floor(wdev * (innerH / innerW)) / RAPORT_PDF_SCALE_;
}
function pageBreakOffsetPx_(el, root, innerH){
  if(!el || !root || !(innerH > 0)) return 0;
  if(el.classList && el.classList.contains("page-break-before")) return 0;
  const elTop = el.getBoundingClientRect().top;
  let baseTop = null;
  let baseSelf = false;
  root.querySelectorAll(".page-break-before").forEach(b=>{
    if(b === el){ baseSelf = true; return; }
    if(el.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) return;
    const t = b.getBoundingClientRect().top;
    if(baseTop === null || t >= baseTop){ baseTop = t; baseSelf = false; }
  });
  if(baseSelf) return 0;
  if(baseTop === null){
    const h = elTop - root.getBoundingClientRect().top;
    return ((h % innerH) + innerH) % innerH;
  }
  const h = elTop - baseTop;
  return ((h % innerH) + innerH) % innerH;
}
function fitReportTablesToPages_(root, grid){
  if(!root || !root.querySelectorAll) return;
  const innerH = grid;
  if(!(innerH > 100)) return;
  const SAFETY = 2;
  const queue = Array.from(root.querySelectorAll("table.report"));
  let guard = 0;
  while(queue.length && guard++ < 24){
    const table = queue.shift();
    const rows = Array.from(table.rows);
    const headRow = rows[0] && rows[0].querySelectorAll("th").length ? rows[0] : null;
    const headH = headRow ? (headRow.offsetHeight || 0) : 0;
    const offset = pageBreakOffsetPx_(table, root, innerH);
    let capacity = innerH - offset;
    if(!(capacity > 10)) capacity = innerH;
    let pageUsed = 0;
    let cutAt = -1;
    const startIdx = headRow ? 1 : 0;
    if(headRow){
      if(headH + SAFETY > capacity){ cutAt = 0; }
      else { pageUsed = headH; }
    }
    if(cutAt < 0){
      for(let i = startIdx; i < rows.length; i++){
        const h = rows[i].offsetHeight || 0;
        if(pageUsed + h + SAFETY > capacity){ cutAt = i; break; }
        pageUsed += h;
      }
    }
    if(cutAt < 0) continue;
    while(cutAt > startIdx && rows[cutAt-1] && rows[cutAt-1].classList.contains("group-row")) cutAt--;
    if(cutAt <= startIdx){
      const parent = table.parentNode;
      const inKeep = parent && parent.classList && parent.classList.contains("keep-block");
      const target = inKeep ? parent : table;
      if(!target.classList.contains("page-break-before")){
        target.classList.add("page-break-before");
        queue.unshift(table);
        continue;
      }
      if(headRow && rows.length > 1){ cutAt = 1; }
      else { continue; }
    }
    const next = table.cloneNode(false);
    const colgroup = table.querySelector("colgroup");
    if(colgroup){ next.appendChild(colgroup.cloneNode(true)); }
    else if(headRow){
      const cg = document.createElement("colgroup");
      Array.from(headRow.cells).forEach(th=>{
        const col = document.createElement("col");
        const w = th.style.width || "";
        if(w) col.style.width = w;
        else if(th.offsetWidth && table.offsetWidth) col.style.width = (th.offsetWidth / table.offsetWidth * 100) + "%";
        cg.appendChild(col);
      });
      next.appendChild(cg);
    }
    next.classList.add("page-break-before");
    for(let i = cutAt; i < rows.length; i++) next.appendChild(rows[i]);
    const parent = table.parentNode;
    if(parent && parent.classList && parent.classList.contains("keep-block")){
      parent.parentNode.insertBefore(next, parent.nextSibling);
    }else{
      table.parentNode.insertBefore(next, table.nextSibling);
    }
    queue.unshift(next);
  }
}
const RAPORT_SPACER_CLS_ = "raport-page-spacer";
const RAPORT_AVOID_SEL_ = ".keep-block, .meta, .note, .catatan, .signature, .headmaster, .pancasila-title, .tema-line, .desk-box, table.legend";
function applyRaportPagination_(root, grid){
  if(!root || !root.querySelectorAll || !(grid > 100)) return;
  const EPS = 0.05;
  const makeSpacer = h=>{
    const d = document.createElement("div");
    d.className = RAPORT_SPACER_CLS_;
    d.style.cssText = `display:block;margin:0;padding:0;border:0;height:${h}px;`;
    return d;
  };
  const isCandidate = el => !!(el && el.classList && (
    el.classList.contains("page-break-before") ||
    (el.matches && el.matches(RAPORT_AVOID_SEL_))
  ));
  const hasCandidateAncestor = el=>{
    let p = el.parentElement;
    while(p && p !== root){
      if(isCandidate(p)) return true;
      p = p.parentElement;
    }
    return false;
  };
  const countBreaks = ()=>root.querySelectorAll(".page-break-before").length;
  let guard = 0;
  while(guard++ < 10){
    root.querySelectorAll("."+RAPORT_SPACER_CLS_).forEach(el=>el.remove());
    const rootTop = root.getBoundingClientRect().top;
    const candidates = Array.from(root.querySelectorAll(".page-break-before, " + RAPORT_AVOID_SEL_));
    for(const el of candidates){
      if(!el.isConnected) continue;
      const r = el.getBoundingClientRect();
      if(!(r.height > 0)) continue;
      const top = r.top - rootTop;
      if(el.classList.contains("page-break-before")){
        const line = Math.floor((top + EPS) / grid) * grid;
        const rem = top - line;
        if(rem > EPS) el.parentNode.insertBefore(makeSpacer(grid - rem), el);
        continue;
      }
      if(hasCandidateAncestor(el)) continue;
      if(el.querySelector && el.querySelector("table.report")) continue;
      const pStart = Math.floor((top + EPS) / grid);
      const pEnd = Math.floor((r.bottom - rootTop - EPS) / grid);
      if(pEnd > pStart && r.height <= grid + EPS){
        const rem = top - pStart * grid;
        const h = rem > EPS ? grid - rem : 0;
        if(h > EPS) el.parentNode.insertBefore(makeSpacer(h), el);
      }
    }
    const before = countBreaks();
    fitReportTablesToPages_(root, grid);
    if(countBreaks() === before) break;
  }
}

    const sp = w.prop.container.querySelectorAll(".raport-page-spacer");

    // VERIFIKASI: tidak boleh ada elemen yang terbelah dua halaman
    const root = w.prop.container;

    const EPS = 0.05;
    const SEL = "tr, .keep-block, .meta, .note, .catatan, .signature, .headmaster, .pancasila-title, .tema-line, .desk-box, table.legend, .section-title, .sub-title";
    const bad = [];
    root.querySelectorAll(SEL).forEach(el=>{
      if(el.closest("table.report") && el.tagName !== "TR") return;
      const r = el.getBoundingClientRect();
      if(!(r.height > 0)) return;
      const top = r.top - rootTop, bottom = r.bottom - rootTop;
      const pS = Math.floor((top + EPS)/grid), pE = Math.floor((bottom - EPS)/grid);
      if(pE > pS) bad.push(`${el.tagName}.${el.className||"-"} page ${pS}->${pE} h=${(r.height).toFixed(1)} top=${top.toFixed(1)} text="${(el.textContent||"").trim().slice(0,40)}"`);
    });
    console.log("DBG straddle-count:", bad.length);
    bad.forEach(b=>console.log("DBG STRADDLE:", b));
    // halaman yang diawali elemen break
    root.querySelectorAll(".page-break-before").forEach(el=>{
      const r = el.getBoundingClientRect();
      const top = r.top - rootTop;
      console.log("DBG break:", el.tagName+"."+(el.className||"-"), "top=", top.toFixed(2), "mod grid=", (top % grid).toFixed(2));
    });

    const blob = await w.output("blob");
    const buf = await blob.arrayBuffer();
    let bin = "";
    const bytes = new Uint8Array(buf);
    const chunk = 0x8000;
    for(let i = 0; i < bytes.length; i += chunk){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    window.__pdfBase64 = btoa(bin);
    document.title = "DONE";
  }catch(e){
    document.title = "ERROR: " + (e && e.message);
    console.error(e);
  }
});
  </script>
</body>
